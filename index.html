<!doctype html>
<html lang="en" class="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!-- Primary Meta Tags -->
    <title>Atahastra</title>
    <meta
      name="description"
      content="Atahastra. Proxim and My Simple Resume."
    />
    <meta
      name="keywords"
      content="Atahastra, Proxim, My Simple Resume, evidence-first knowledge, resume"
    />
    <meta name="author" content="Atahastra" />
    <meta name="robots" content="index, follow, max-image-preview:large, max-snippet:-1, max-video-preview:-1" />
    <meta name="theme-color" content="#000000" id="theme-color" />
    <link rel="canonical" href="https://atahastra.com/" />

    <!-- Icons -->
    <link rel="icon" type="image/png" href="/favicon.png?v=2" />
    <link rel="apple-touch-icon" href="/favicon.png?v=2" />
    <link rel="manifest" href="/site.webmanifest" />

    <!-- Open Graph / Facebook / LinkedIn -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Atahastra" />
    <meta property="og:url" content="https://atahastra.com/" />
    <meta property="og:title" content="Atahastra" />
    <meta
      property="og:description"
      content="Atahastra. Proxim and My Simple Resume."
    />
    <meta property="og:image" content="https://atahastra.com/logo.png" />
    <meta property="og:image:alt" content="Atahastra logo" />
    <meta property="og:locale" content="en_US" />

    <!-- Twitter / X -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:site" content="@atahastra" />
    <meta name="twitter:title" content="Atahastra" />
    <meta
      name="twitter:description"
      content="Atahastra. Proxim and My Simple Resume."
    />
    <meta name="twitter:image" content="https://atahastra.com/logo.png" />

    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap"
      rel="stylesheet"
    />

    <!-- Structured Data: Organization -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "Organization",
        "name": "Atahastra",
        "url": "https://atahastra.com",
        "logo": "https://atahastra.com/logo.png",
        "image": "https://atahastra.com/logo.png",
        "description": "Atahastra. Proxim and My Simple Resume.",
        "email": "admin@atahastra.com",
        "foundingDate": "2024",
        "knowsAbout": [
          "Proxim",
          "My Simple Resume",
          "Evidence-First Knowledge"
        ],
        "sameAs": [
          "https://www.linkedin.com/company/atahastra/",
          "https://x.com/atahastra",
          "https://www.instagram.com/atahastra/"
        ],
        "contactPoint": {
          "@type": "ContactPoint",
          "contactType": "customer support",
          "email": "admin@atahastra.com",
          "availableLanguage": ["English"]
        }
      }
    </script>

    <!-- Structured Data: WebSite -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "WebSite",
        "name": "Atahastra",
        "url": "https://atahastra.com"
      }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
