<!doctype html>
<html lang="en" class="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!-- Primary Meta Tags -->
    <title>Atahastra | Web, Mobile Apps, Shopify & UI Agency</title>
    <meta
      name="description"
      content="Atahastra is a design and development agency. We build full-stack websites, mobile apps, Shopify stores, custom web apps, and UI/UX design."
    />
    <meta
      name="keywords"
      content="Atahastra, web development agency, mobile app development, Shopify development, web apps, UI UX design"
    />
    <meta name="author" content="Atahastra" />
    <meta
      name="robots"
      content="index, follow, max-image-preview:large, max-snippet:-1, max-video-preview:-1"
    />
    <meta name="theme-color" content="#000000" id="theme-color" />
    <link rel="canonical" href="https://atahastra.com/" />

    <!-- Icons -->
    <link rel="icon" type="image/png" href="/favicon.png?v=2" />
    <link rel="apple-touch-icon" href="/favicon.png?v=2" />
    <link rel="manifest" href="/site.webmanifest" />

    <!-- Open Graph / Facebook / LinkedIn -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Atahastra" />
    <meta property="og:url" content="https://atahastra.com/" />
    <meta
      property="og:title"
      content="Atahastra | Web, Mobile Apps, Shopify & UI Agency"
    />
    <meta
      property="og:description"
      content="Atahastra is a design and development agency. We build full-stack websites, mobile apps, Shopify stores, custom web apps, and UI/UX design."
    />
    <meta property="og:image" content="https://atahastra.com/hero.png" />
    <meta property="og:image:alt" content="Atahastra Agency" />
    <meta property="og:locale" content="en_US" />

    <!-- Twitter / X -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:site" content="@atahastra" />
    <meta
      name="twitter:title"
      content="Atahastra | Web, Mobile Apps, Shopify & UI Agency"
    />
    <meta
      name="twitter:description"
      content="Design and development agency building websites, mobile apps, Shopify stores, web apps, and UI."
    />
    <meta name="twitter:image" content="https://atahastra.com/hero.png" />

    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600&display=swap"
      rel="stylesheet"
    />

    <!-- Structured Data: Organization -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "Organization",
        "name": "Atahastra",
        "url": "https://atahastra.com",
        "logo": "https://atahastra.com/logo.png",
        "image": "https://atahastra.com/hero.png",
        "description": "Atahastra is a design and development agency building websites, mobile apps, Shopify stores, web apps, and UI.",
        "email": "contact@atahastra.com",
        "foundingDate": "2024",
        "knowsAbout": [
          "Web Development",
          "Mobile App Development",
          "Shopify Development",
          "Web Applications",
          "UI UX Design"
        ],
        "sameAs": [
          "https://www.linkedin.com/company/atahastra/",
          "https://x.com/atahastra",
          "https://www.instagram.com/atahastra/"
        ],
        "contactPoint": {
          "@type": "ContactPoint",
          "contactType": "customer support",
          "email": "contact@atahastra.com",
          "availableLanguage": ["English"]
        }
      }
    </script>

    <!-- Structured Data: FAQ (matches homepage FAQ) -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "FAQPage",
        "mainEntity": [
          {
            "@type": "Question",
            "name": "How much will it cost?",
            "acceptedAnswer": {
              "@type": "Answer",
              "text": "A fixed quote before we start. No hourly billing, no surprises."
            }
          },
          {
            "@type": "Question",
            "name": "How long does it take?",
            "acceptedAnswer": {
              "@type": "Answer",
              "text": "Most websites ship in 2 to 4 weeks. Apps and complex builds take longer."
            }
          },
          {
            "@type": "Question",
            "name": "What happens after launch?",
            "acceptedAnswer": {
              "@type": "Answer",
              "text": "We hand over everything and stay on for updates and support."
            }
          }
        ]
      }
    </script>

    <!-- Structured Data: WebSite -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "WebSite",
        "name": "Atahastra",
        "url": "https://atahastra.com"
      }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
