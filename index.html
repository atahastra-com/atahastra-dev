<!doctype html>
<html lang="en" class="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!-- Primary Meta Tags (title/description/canonical are rewritten per page by scripts/prerender.mjs) -->
    <title>Atahastra | Websites, Mobile Apps, Shopify &amp; UI/UX Agency</title>
    <meta
      name="description"
      content="Atahastra designs and builds websites, mobile apps, Shopify stores, custom web apps, and UI/UX. Fixed quotes, fast delivery, and support after launch."
    />
    <meta name="author" content="Atahastra" />
    <meta
      name="robots"
      content="index, follow, max-image-preview:large, max-snippet:-1, max-video-preview:-1"
    />
    <meta name="theme-color" content="#000000" />
    <meta name="color-scheme" content="dark" />
    <meta name="format-detection" content="telephone=no" />
    <link rel="canonical" href="https://www.atahastra.com/" />

    <!-- Icons -->
    <link rel="icon" type="image/png" sizes="1024x1024" href="/favicon.png?v=2" />
    <link rel="apple-touch-icon" href="/favicon.png?v=2" />
    <link rel="manifest" href="/site.webmanifest" />

    <!-- Open Graph / Facebook / LinkedIn -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Atahastra" />
    <meta property="og:url" content="https://www.atahastra.com/" />
    <meta
      property="og:title"
      content="Atahastra | Websites, Mobile Apps, Shopify &amp; UI/UX Agency"
    />
    <meta
      property="og:description"
      content="Atahastra designs and builds websites, mobile apps, Shopify stores, custom web apps, and UI/UX. Fixed quotes, fast delivery, and support after launch."
    />
    <meta property="og:image" content="https://www.atahastra.com/hero.png" />
    <meta property="og:image:type" content="image/png" />
    <meta property="og:image:width" content="1024" />
    <meta property="og:image:height" content="576" />
    <meta property="og:image:alt" content="Atahastra, design and development agency" />
    <meta property="og:locale" content="en_US" />

    <!-- Twitter / X -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:site" content="@atahastra" />
    <meta
      name="twitter:title"
      content="Atahastra | Websites, Mobile Apps, Shopify &amp; UI/UX Agency"
    />
    <meta
      name="twitter:description"
      content="Atahastra designs and builds websites, mobile apps, Shopify stores, custom web apps, and UI/UX. Fixed quotes, fast delivery, and support after launch."
    />
    <meta name="twitter:image" content="https://www.atahastra.com/hero.png" />
    <meta name="twitter:image:alt" content="Atahastra, design and development agency" />

    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600&display=swap"
      rel="stylesheet"
    />

    <!-- Structured Data: Organization + WebSite (site-wide). Page-specific schema is added at build time. -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@graph": [
          {
            "@type": "Organization",
            "@id": "https://www.atahastra.com/#organization",
            "name": "Atahastra",
            "url": "https://www.atahastra.com/",
            "logo": {
              "@type": "ImageObject",
              "url": "https://www.atahastra.com/logo.png",
              "width": 1024,
              "height": 1024
            },
            "image": "https://www.atahastra.com/hero.png",
            "description": "Atahastra is a design and development agency building websites, mobile apps, Shopify stores, custom web apps, and UI/UX.",
            "email": "contact@atahastra.com",
            "foundingDate": "2024",
            "knowsAbout": [
              "Website Design and Development",
              "Mobile App Development",
              "React Native",
              "Shopify Development",
              "Ecommerce",
              "Web Application Development",
              "UI/UX Design",
              "Technical SEO"
            ],
            "sameAs": [
              "https://www.linkedin.com/company/atahastra/",
              "https://x.com/atahastra",
              "https://www.instagram.com/atahastra/"
            ],
            "contactPoint": {
              "@type": "ContactPoint",
              "contactType": "sales",
              "email": "contact@atahastra.com",
              "url": "https://cal.com/atahastra/30min",
              "availableLanguage": ["English"]
            }
          },
          {
            "@type": "WebSite",
            "@id": "https://www.atahastra.com/#website",
            "name": "Atahastra",
            "url": "https://www.atahastra.com/",
            "inLanguage": "en",
            "publisher": { "@id": "https://www.atahastra.com/#organization" }
          }
        ]
      }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
